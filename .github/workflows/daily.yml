
name: Luxury Life AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python libraries
        run: |
          python -m pip install requests
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run video generator
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate.py

      - name: Prepare YouTube credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c "import os; from pathlib import Path; p=Path('token.json'); p.write_text(os.environ['YOUTUBE_TOKEN_JSON'], encoding='utf-8'); print('YouTube credentials file prepared')"

      - name: Upload videos to YouTube
        run: python upload_youtube.py

      - name: Save generated videos
        uses: actions/upload-artifact@v4
        with:
          name: luxury-life-videos
          path: videos/
          if-no-files-found: error
