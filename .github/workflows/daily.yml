
name: Luxury Life AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Europe/Berlin'
    - cron: '0 15 * * *'
      timezone: 'Europe/Berlin'
    - cron: '0 20 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: luxury-life-ai
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare upload history
        run: |
          if [ ! -f uploaded_videos.json ]; then
            echo "{}" > uploaded_videos.json
          fi

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python libraries
        run: |
          python -m pip install requests
          python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Generate videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate.py

      - name: Prepare YouTube credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c "import os; from pathlib import Path; Path('token.json').write_text(os.environ['YOUTUBE_TOKEN_JSON'], encoding='utf-8')"

      - name: Upload videos to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python upload_youtube.py

      - name: Save upload history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploaded_videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube upload history"
            git push origin HEAD:main
          else
            echo "No upload history changes to save"
          fi

      - name: Save generated videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-life-videos-${{ github.run_id }}
          path: videos/*.mp4
          if-no-files-found: warn
          retention-days: 30
