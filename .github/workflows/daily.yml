

name: Luxury Life AI

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run robot
        run: python generate.py

      - name: Save ideas
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-ideas
          path: videos/
